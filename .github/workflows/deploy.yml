name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than racing the older one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    # The deploy account trusts only jobs in this environment, and the
    # environment admits only main (see README).
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [booking-api, flight-status-api]
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      OTEL_PIPELINE_PROJECT: ${{ vars.OTEL_PIPELINE_PROJECT }}
      IMAGE: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --build-arg SERVICE=${{ matrix.service }} -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          python3 deploy/render.py ${{ matrix.service }} "$IMAGE" > service.json
          gcloud run services replace service.json --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe ${{ matrix.service }} --region "$GCP_REGION" --project "$GCP_PROJECT" --format 'value(status.url)')
          for i in $(seq 1 10); do curl -fsS "$url/healthz" && exit 0; sleep 3; done
          exit 1
